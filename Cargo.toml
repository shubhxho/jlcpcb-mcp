[package]
name = "jlcpcb-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["shubhxho"]
license = "MIT"
description = "MCP server for finding and evaluating JLCPCB / LCSC electronic components for PCB assembly"
repository = "https://github.com/shubhxho/jlcpcb-mcp"
readme = "README.md"
keywords = ["mcp", "jlcpcb", "lcsc", "electronics", "pcb"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "jlcpcb-mcp"
path = "src/main.rs"

[lib]
name = "jlcpcb_mcp"
path = "src/lib.rs"

[dependencies]
base64 = "0.23.1"
hmac = "0.13.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.9.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-util", "time"] }
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
